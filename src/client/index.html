<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Intersection Prototype</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <main class="viewport" id="landingView">
        <section class="hero">
            <h1 class="logo">Intersection</h1>
            <p class="tagline">Harmony · Dimension · Universe</p>
            <p class="intro">
                스마트폰을 통해 빈 우주에 입장하고, 보이지 않는 중력 힌트를 따라 다른 행성과 교차하는 순간을 준비하세요.
                지금은 프로토타입 초기 단계로, 기본 경험 뼈대를 정리하고 있습니다.
            </p>
        </section>
        <section class="actions">
            <input id="displayNameInput" class="name-input" type="text" placeholder="닉네임 (선택)" maxlength="20">
            <button id="enterPersonal" class="primary">Personal View</button>
            <button id="enterGlobal" class="secondary">Global Display</button>
        </section>
        <section class="status">
            <h2>Current Focus</h2>
            <ul>
                <li>중력 힌트와 접촉 이벤트 프로토타입 설계</li>
                <li>글로벌 뷰 시각 요소 리서치</li>
                <li>실시간 동기화를 위한 서버 구조 조사</li>
            </ul>
        </section>
    </main>
    <div id="spaceView" class="space-view hidden">
        <canvas id="spaceCanvas"></canvas>
        <div class="hud">
            <div class="hud-line">
                <span class="hud-label">Mode</span>
                <span id="modeLabel" class="hud-value">-</span>
            </div>
            <div class="hud-line">
                <span class="hud-label">Identity</span>
                <span id="nameLabel" class="hud-value">-</span>
            </div>
            <div class="hud-line">
                <span class="hud-label">Participants</span>
                <span id="populationLabel" class="hud-value">0</span>
            </div>
            <button id="exitView" class="hud-exit">나가기</button>
        </div>
        <div id="statusMessage" class="status-message">Connecting…</div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
