name: Release

on:
    workflow_dispatch:
        inputs:
            ref:
                description: "Git ref (branch or tag) to release"
                required: false
                default: ""
            push_image:
                description: "Build & publish Docker image"
                required: true
                type: boolean
                default: true
            deploy:
                description: "Deploy to production server"
                required: true
                type: boolean
                default: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build:
        if: ${{ inputs.push_image || inputs.deploy }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.ref }}

            - name: Log into registry ${{ env.REGISTRY }}
              if: ${{ inputs.push_image }}
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              if: ${{ inputs.push_image }}
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Build and (optionally) push Docker image
              if: ${{ inputs.push_image }}
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

    deploy:
        needs: build
        if: ${{ inputs.deploy }}
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.ref }}

            - name: Sync application to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  port: ${{ secrets.SSH_PORT || '22' }}
                  key: ${{ secrets.SSH_KEY }}
                  source: "."
                  target: ${{ secrets.SSH_TARGET_DIR }}
                  rm: true

            - name: Restart application
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  port: ${{ secrets.SSH_PORT || '22' }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      cd "${{ secrets.SSH_TARGET_DIR }}"
                      docker compose down || true
                      docker compose up -d --build
